# Deployment configuration for the join endpoint.
#
# There is no secret in this file and there never should be. The GitHub token
# is stored by Cloudflare, set once with `wrangler secret put GITHUB_TOKEN`,
# and is not readable back out afterwards.

name = "kop-fund-join"
main = "index.mjs"
compatibility_date = "2026-09-01"

# Nothing is cached and nothing is stored. The endpoint reads the register
# from GitHub on every request and writes it back, so GitHub stays the single
# copy of the truth and this endpoint holds no state of its own to go stale,
# leak, or disagree with the published register.
